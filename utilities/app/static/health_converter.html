<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Converter</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; margin-top: 50px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px 20px; cursor: pointer; margin-bottom: 20px; background: #f8fafc; transition: all 0.2s; }
        .upload-area:hover { border-color: #3b82f6; background: #eff6ff; }
        input[type="file"] { display: none; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.2s; width: 100%; font-weight: bold; }
        button:hover { background: #2563eb; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #64748b; }
        .back { align-self: flex-start; text-decoration: none; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>
    <a href="/tools/" class="back">&larr; Back to Tools</a>
    <div class="card">
        <h1>Health Converter</h1>
        <p>Upload your export.xml or export.zip</p>
        <form id="uploadForm" action="/api/healthconverter/convert" method="post" enctype="multipart/form-data">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div id="fileName">Click to select file</div>
            </div>
            <input type="file" id="fileInput" name="file" accept=".xml,.zip" onchange="document.getElementById('fileName').innerText = this.files[0] ? this.files[0].name : 'Click to select file'" />
            <button type="submit" id="submitBtn">Convert to CSV</button>
        </form>
        <div id="status"></div>
    </div>
    <script>
        const form = document.getElementById('uploadForm');
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        form.onsubmit = function() {
            if(!document.getElementById('fileInput').files.length) {
                alert("Please select a file first");
                return false;
            }
            btn.disabled = true;
            btn.innerText = "Converting... (may take a minute)";
            status.innerText = "Uploading and processing...";
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "Convert to CSV";
                status.innerText = "";
            }, 10000); // UI reset assuming download started
            return true;
        };
    </script>
</body>
</html>
